name: Deploy Jaliyan website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html about.html management.html certifications.html gallery.html contact.html privacy.html terms.html robots.txt sitemap.xml .nojekyll _site/
          cp -R css js assets _site/
          test -s _site/assets/jaliyan-video.mp4
          test -s _site/assets/company-logo.png
          node --check _site/js/script.js
          node --check _site/js/contact-enquiry.js
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
